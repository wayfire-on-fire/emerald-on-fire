name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  # Flagship accessible path: Docker toolchain build + test (zero host deps).
  docker:
    name: docker build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A SINGLE make invocation: binary and test share the build-docker
      # prerequisite, so the plugin is compiled ONCE (a .PHONY target would
      # run again under a separate `make` call). The release build runs the
      # gtest suite and packages the ./dist artifact.
      - name: Build toolchain image + plugin, run tests, package artifacts
        run: make binary test
      - name: Verify artifacts
        run: |
          test -f dist/wayfire/libemeraldwf.so
          ls -R dist
      - uses: actions/upload-artifact@v4
        with:
          name: emeraldwf
          path: dist/

  # Matches WayfireWM/wayfire CI: build wayfire from source on a standard
  # glibc toolchain and build the plugin against it. Catches anything the
  # Docker image might mask.
  native:
    name: native (wayfire from source) + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config meson ninja-build cmake bison git \
            libgtk-3-dev libgdk-pixbuf-2.0-dev \
            libcairo2-dev libglib2.0-dev libx11-dev libgtest-dev \
            libwayland-dev wayland-protocols libexpat1-dev libffi-dev \
            python3 python3-pip libinput-dev \
            libevdev-dev libxkbcommon-dev libpixman-1-dev libglm-dev \
            libdrm-dev libudev-dev libgbm-dev libseat-dev \
            libdisplay-info-dev \
            hwdata libxml2-dev libpango1.0-dev \
            imagemagick
      # Build wayfire v0.11.0 from source into /usr via the shared recipe
      # (single source of truth; also used by the Dockerfile and provision.sh).
      - name: Build + install wayfire from source (shared recipe)
        run: bash scripts/build-wayfire-from-source.sh
      - name: Configure
        run: meson setup build --buildtype=release
      - name: Build
        run: ninja -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      # The emeraldwf-engine-pane test (the part-07 SEGV regression) needs a
      # display and self-skips without one. Run it under Xvfb and require a
      # PASSED result — a meson-test success alone would pass a self-skip.
      - name: Test engine pane under a display (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          if ! xvfb-run -a ./build/tests/emeraldwf-engine-pane > /tmp/engine-pane.log 2>&1; then
            echo "FAIL: engine-pane test or Xvfb failed"; cat /tmp/engine-pane.log
            [ -s /tmp/engine-pane.log ] || echo "(engine-pane.log is empty - Xvfb likely never started)"
            exit 1
          fi
          grep -q '\[  PASSED  \]' /tmp/engine-pane.log \
            || { echo "FAIL: engine-pane test did not PASS"; cat /tmp/engine-pane.log; exit 1; }
          # if-form (not a trailing `grep && {...}`, which exits 1 on a PASS).
          if grep -q '\[  SKIPPED  \]' /tmp/engine-pane.log; then
            echo "FAIL: engine-pane test self-skipped under Xvfb"; cat /tmp/engine-pane.log; exit 1
          fi
      # Run the real installer (the docker job never does) and verify the layout.
      - name: Run install.sh (the real install path, not just meson install)
        run: |
          sudo ./install.sh --skip-tests
          LIBDIR="$(pkg-config --variable=libdir wayfire)"
          case "$LIBDIR" in /*) : ;; *) LIBDIR="/usr/$LIBDIR" ;; esac
          test -f "$LIBDIR/wayfire/libemeraldwf.so"
          test -f "$LIBDIR/emeraldwf/libemeraldengine.so"
          # Count only the versioned files (libX.so.M.N.P): the install leaves
          # extra .so / .so.0 symlinks per engine, which a bare count would add.
          test "$(find "$LIBDIR/emeraldwf/engines" -maxdepth 1 -type f -name 'lib*.so.*' -printf '%f\n' | grep -cE '^lib.*\.so\.[0-9]+\.[0-9]+\.[0-9]+$')" -eq 7
      - uses: actions/upload-artifact@v4
        with:
          name: emeraldwf-native
          path: build/src/libemeraldwf.so

  # per-distro build + test jobs (no session; the visible-GUI path is the
  # local QEMU harness in e2e/distros/). Test RUNTIME deps (gtest, awk, git,
  # ImageMagick, fonts) are installed so the full suite runs in both images.
  distro-compile:
    name: build + test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            # Pinned to a date tag (not :latest) so the base system is
            # deterministic across runs. Arch is rolling; a bare :latest base
            # would let an Arch base release change the build environment for a
            # reason unrelated to the plugin.
            image: archlinux:base-20261108.0.623074
            install: |
              # pacman -Syu (NOT a bare -Sy): Arch is a rolling-release distro
              # with no safe partial upgrades. A bare -Sy (refresh the db +
              # install the named packages, no full upgrade) can install
              # packages built against a newer base while the image's base stays
              # old, breaking the build with incompatible libraries. -Syu keeps
              # the system consistent; the pinned image above keeps the base
              # deterministic.
              # imagemagick: the emeraldwf-e2e-script test uses `convert`
              # (imgcmp) — not in the base image.
              pacman -Syu --noconfirm --needed base-devel git meson ninja pkgconf \
                wayfire glm gtk3 gdk-pixbuf2 cairo glib2 libx11 pango gtest \
                imagemagick
          - distro: opensuse
            image: opensuse/tumbleweed:latest
            install: |
              # gawk/git/ImageMagick/dejavu-fonts: test RUNTIME deps the
              # base image lacks — the script-block tests extract with
              # awk, the vendor_check tests need git, imgcmp needs
              # `convert`, and the Pango text-metric tests need a font.
              # --force-resolution (an install-SPECIFIC option — it must
              # come AFTER the subcommand; before it, zypper's global
              # option parser rejects it: runs 44107232120 + 44108761840):
              # the Tumbleweed 2026-11-17 snapshot split
              # libsystemd0/libudev1 into runtime + "-mini"
              # (build-env-only) variants; wayfire-devel -> wlroots-devel
              # -> pkgconfig(libudev) then only resolved to the mini
              # variant, which needs the virtual
              # 'this-is-only-for-build-envs' — unresolvable in a normal
              # container (CI red on 2026-11-17, runs
              # 44103752035 + 44105392523). The flag makes the solver
              # apply its computed solution (downgrade the two runtime
              # libs to the version that still ships the .pc) instead of
              # prompting; it is a no-op once Tumbleweed fixes the
              # packaging.
              zypper --non-interactive install --force-resolution --no-recommends \
                gcc gcc-c++ make glm-devel wayfire wayfire-devel meson ninja pkgconf \
                gtk3-devel gdk-pixbuf-devel cairo-devel glib2-devel libX11-devel \
                pango-devel gtest Mesa-libGLESv3-devel \
                gawk git ImageMagick dejavu-fonts
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: ${{ matrix.install }}
      - name: Configure (meson)
        run: meson setup build
      - name: Build (ninja)
        run: ninja -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      - name: Verify plugin compiled
        run: |
          test -f build/src/libemeraldwf.so
          echo "built: $(du -h build/src/libemeraldwf.so | cut -f1)"

  # Wayfire enforces a shared uncrustify config; match it. Project C++ only —
  # the vendored third_party/emerald tree is excluded (kept unmodified).
  code_style:
    name: code style (uncrustify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y git cmake gcc make
      - name: Fetch uncrustify
        uses: actions/checkout@v4
        with:
          repository: ammen99/uncrustify
          path: uncrustify
      - name: Compile uncrustify
        run: |
          # CMAKE_POLICY_VERSION_MINIMUM: the runner's CMake 4.x rejects
          # uncrustify's old cmake_minimum_required(<3.5) without it.
          cd uncrustify && mkdir build && cd build \
            && cmake .. -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && make
      - name: Fetch wayfire's uncrustify.ini
        run: wget -q https://raw.githubusercontent.com/WayfireWM/wayfire/master/uncrustify.ini
      - name: Check formatting
        run: |
          git ls-files | grep -vE '^third_party/' | grep -E '\.(cpp|hpp)$' \
            | xargs ./uncrustify/build/uncrustify -c uncrustify.ini --no-backup --replace
          git diff --exit-code
