# emeraldwf E2E — minimal wayfire config.
#
# Only the emeraldwf plugin is enabled (no wobbly, no other effects) so the
# test compositor stays deterministic. Default workspaces, default keybindings.
#
# Plugin is discovered from <plugin-path> (libdir/wayfire) at runtime. The
# theme engine .so files are searched at <libdir>/emeraldwf/engines/ (the
# dlopen system_dir wired in part 02), and core settings live in
# ~/.emerald/settings.ini (D10).
#
# Run:
#   wayfire -c e2e/wayfire.ini
# (under a headless GPU: LIBGL_ALWAYS_SOFTWARE=1, lavapipe — see run.sh header)

[core]
plugins = \
  emeraldwf

[emeraldwf]
engine = truglass
theme_dir = ~/.emerald/theme
maximized_borders = true
maximized_shadows = true
enable_shade = true
